name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - name: Crate LICENSE copies match the root LICENSE
        run: |
          for license in crates/*/LICENSE; do
            cmp LICENSE "$license" || {
              echo "::error file=$license::differs from LICENSE"
              exit 1
            }
          done

  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit, integration, property, doc (including the READMEs) and
      # compile-error tests. The compile-error snapshots in
      # crates/bryl/tests/ui match current stable rustc wording; regenerate
      # them with TRYBUILD=overwrite when a new release changes it.
      - run: cargo test --workspace

  msrv:
    name: Test (MSRV 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # rust-toolchain.toml selects stable, so name the toolchain explicitly.
      # Skip only the compile-error snapshot test (`ui`), whose expected
      # output follows current stable rustc wording.
      - run: cargo +1.85 test --workspace -- --skip ui --exact

  fuzz:
    name: Fuzz (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Run each fuzz target for 60 seconds
        working-directory: fuzz
        run: |
          for target in nacha_file metro2_file; do
            mkdir -p "corpus/$target"
            cargo +nightly fuzz run "$target" "corpus/$target" "seeds/$target" -- \
              -max_total_time=60 -max_len=8192
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
