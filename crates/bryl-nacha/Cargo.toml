[package]
name = "bryl-nacha"
description = "NACHA ACH file reading and writing"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["nacha", "ach", "banking", "fixed-width", "payments"]
categories = ["encoding", "parser-implementations", "finance"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE"]

[lib]
name = "nacha"

[dependencies]
bon.workspace = true
bryl.workspace = true
chrono.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true
serde_json.workspace = true

[features]
default = ["clock"]
# `FileParams::now()`, which reads the system clock.
clock = ["chrono/clock"]
# Serialize and deserialize records, files and code tables.
serde = ["dep:serde", "bryl/serde", "chrono/serde"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "write_sample"
required-features = ["clock"]

[lints]
workspace = true
