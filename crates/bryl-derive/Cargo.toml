[package]
name = "bryl-derive"
description = "Derive macros for bryl fixed-width records"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["fixed-width", "record", "derive"]
categories = ["encoding"]
include = ["src/**", "README.md", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
bryl-pattern.workspace = true
proc-macro2 = "1.0.88"
quote = "1.0.35"
syn = { version = "2.0.87", features = ["full"] }

[lints]
workspace = true
