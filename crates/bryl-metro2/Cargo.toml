[package]
name = "bryl-metro2"
description = "Metro 2 credit reporting file reading and writing"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["metro2", "credit-reporting", "fixed-width", "cdia"]
categories = ["encoding", "parser-implementations", "finance"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE"]

[lib]
name = "metro2"

[dependencies]
bon.workspace = true
bryl.workspace = true
chrono.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true
serde_json.workspace = true

[features]
# Serialize and deserialize records, files and code tables.
serde = ["dep:serde", "bryl/serde", "chrono/serde"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
