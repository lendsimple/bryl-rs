[package]
name = "bryl"
description = "Declarative fixed-width record encoding and decoding"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["fixed-width", "record", "encoding", "parser", "derive"]
categories = ["encoding", "parser-implementations"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]

[dependencies]
bryl-derive.workspace = true
bryl-pattern.workspace = true
chrono.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[features]
# Serialize code tables as their codes, and errors.
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
