[workspace]
resolver = "3"
members = [
    "crates/bryl",
    "crates/bryl-derive",
    "crates/bryl-metro2",
    "crates/bryl-nacha",
    "crates/bryl-pattern",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael Lavers <kolanos@gmail.com>"]
license = "MIT"
repository = "https://github.com/lendsimple/bryl-rs"

[workspace.dependencies]
bryl = { path = "crates/bryl", version = "0.1.0" }
bryl-derive = { path = "crates/bryl-derive", version = "0.1.0" }
bryl-pattern = { path = "crates/bryl-pattern", version = "0.1.0" }
bon = "3"
chrono = { version = "0.4.23", default-features = false, features = ["alloc"] }
thiserror = "2"
proptest = "1"
pretty_assertions = "1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
